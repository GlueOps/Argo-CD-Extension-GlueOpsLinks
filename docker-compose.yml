services:
  valkey:
    image: valkey/valkey:latest@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    container_name: gluelinks-valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: ghcr.io/glueops/gluelinks-api:v3.1.0@sha256:349c394155876b98c0e5a3e022a506f8eb6489ac4a1f38ed3dcd10213bebe783
    container_name: gluelinks-api
    ports:
      - "8002:8000"
    environment:
      USE_MOCK_DATA: "true"
      VALKEY_URL: "redis://valkey:6379"
      GRAFANA_BASE_URL: "https://grafana.example.com"
      VAULT_BASE_URL: "https://vault.example.com"
      LOG_LEVEL: "DEBUG"
    depends_on:
      valkey:
        condition: service_healthy
